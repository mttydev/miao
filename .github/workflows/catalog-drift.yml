name: Catalog drift

# The self-maintained model overlay exists for models the served catalog does
# not carry yet. Nothing notices when the catalog catches up, so the table grows
# and the shipped snapshot keeps a stale opinion. This compares the two on a
# schedule: a fully redundant entry fails the run, and a partly redundant one is
# printed for review.

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  drift:
    name: overlay vs served catalog
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Point the build at the scratch volume
        run: |
          sudo mkdir -p /mnt/cargo-target 2>/dev/null || true
          if sudo chown -R "$(id -u):$(id -g)" /mnt/cargo-target 2>/dev/null; then
            echo "CARGO_TARGET_DIR=/mnt/cargo-target" >> "$GITHUB_ENV"
          fi
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        timeout-minutes: 10
      - name: Compare the overlay with the served catalog
        working-directory: crates/miao-engine
        run: cargo test --test catalog_drift -- --ignored --nocapture

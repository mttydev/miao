name: retry-cancelled

# A job that never reached a runner is an infrastructure cancellation, not a
# verdict on the commit. On 2026-11-18 a `macos-15` leg queued for fifteen
# minutes and was cancelled with `runner_name` empty — three times across two
# workflows — and the release gate then refused to ship a commit whose code was
# green everywhere else. Re-running the failed jobs is exactly what an operator
# does by hand.
#
# Two shapes have to be covered, because the platform reports them differently:
# a whole run cancelled before its jobs started, and a single leg cancelled
# while the rest of its run kept going. The second shape leaves the run itself
# `in_progress` and then `failure`, so matching only on the run's conclusion
# missed it and this workflow stayed skipped. The script below inspects the
# jobs and retries only when nothing in the run actually failed.
#
# Only push runs are retried: a pull request's older run is cancelled on
# purpose when a new push supersedes it, and retrying that would race the run
# that replaced it. `run_attempt < 3` bounds the retries to two, so a runner
# pool that is genuinely down reports red instead of looping.
on:
  workflow_run:
    workflows: [ci, native, release]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  retry:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Re-run the jobs that never reached a runner
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 .github/scripts/retry-infrastructure-cancellation.py
